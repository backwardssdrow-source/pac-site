<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>In Good Company | Services and Pricing</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17121f;color:#f8f4f7;font:16px/1.5 Arial,sans-serif}
    .loading{max-width:36rem;padding:2rem;text-align:center}.loading strong{display:block;font:700 2rem Georgia,serif;margin-bottom:.6rem}.loading p{color:#d6cdd9}
  </style>
</head>
<body>
  <div class="loading" id="loading"><strong>In Good Company</strong><p>Loading the August partner-review site…</p></div>
  <script src="./assets/site-payload-01.js"></script>
  <script src="./assets/site-payload-02.js"></script>
  <script src="./assets/site-payload-03.js"></script>
  <script src="./assets/site-payload-04.js"></script>
  <script src="./assets/site-payload-05.js"></script>
  <script src="./assets/site-payload-06.js"></script>
  <script>
    (async()=>{
      try{
        const b=window.__IGC_B64||"";
        if(b.length!==31000) throw new Error(`Incomplete site payload: ${b.length}/31000`);
        const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));
        const stream=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html=await new Response(stream).text();
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        const node=document.getElementById('loading');
        node.innerHTML='<strong>Unable to load the preview</strong><p>Please refresh once. If the problem continues, open the Google Docs package while the website preview is repaired.</p>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
