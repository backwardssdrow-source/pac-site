name: Prepare MakeGood community refinements
on:
  push:
    branches: [makegood-community-pathways-20261009]
    paths: ['.github/scripts/refine-makegood-community.py', '.github/scripts/verify-makegood-community.py', '.github/workflows/prepare-makegood-community.yml', 'makegood/service-navigation.js']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install matching test packages
        timeout-minutes: 3
        run: |
          python -m pip install playwright==1.63.0 beautifulsoup4
          python - <<'PY'
          import json,urllib.request,tarfile,io
          from pathlib import Path
          with urllib.request.urlopen('https://registry.npmjs.org/axe-core/latest',timeout=25) as r:meta=json.load(r)
          with urllib.request.urlopen(meta['dist']['tarball'],timeout=30) as r:raw=r.read()
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive:
              p=Path('node_modules/axe-core/axe.min.js');p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(archive.extractfile('package/axe.min.js').read())
          PY
      - name: Prepare approved editorial changes
        run: python .github/scripts/refine-makegood-community.py
      - name: Check existing navigation and accessibility
        env:
          MAKEGOOD_LOCAL: '1'
          MAKEGOOD_WEBKIT: '1'
        run: python .github/scripts/verify-makegood.py
      - name: Check new service paths and community copy
        env:
          MAKEGOOD_LOCAL: '1'
          MAKEGOOD_WEBKIT: '1'
        run: python .github/scripts/verify-makegood-community.py
      - name: Store tested tree without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def request(path,data=None):
              payload=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(api+path,data=payload,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          parent=os.environ['GITHUB_SHA']
          base=request('/git/commits/'+parent)['tree']['sha']
          names=['makegood/index.html','makegood/services.html','makegood/about.html','makegood/approach.html','makegood/site-manifest.json','makegood/services/erg-portfolio-diagnostic.html','makegood/services/erg-operating-model-build.html','makegood/services/fractional-erg-office.html','makegood/services/practice-lab.html','makegood/services/presence-lab.html','.github/workflows/verify-service-guide-spacing.yml']
          entries=[{'path':name,'mode':'100644','type':'blob','content':(root/name).read_text()} for name in names]
          tree=request('/git/trees',{'base_tree':base,'tree':entries})['sha']
          out=root/'community-verification'
          (out/'prepared-tree.txt').write_text(tree)
          (out/'prepared-parent.txt').write_text(parent)
          (out/'prepared-files.json').write_text(json.dumps(names,indent=2))
          print('Tested tree stored without moving any branch:',tree)
          PY
      - name: Save previews and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makegood-community-review
          path: |
            community-verification/
            makegood-verification/
          retention-days: 7
