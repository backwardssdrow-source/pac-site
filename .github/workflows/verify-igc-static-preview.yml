name: Verify In Good Company static preview

on:
  push:
    paths:
      - '.github/workflows/verify-igc-static-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and validate public preview
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cdn.statically.io/gh/backwardssdrow-source/pac-site@b0dad08524c217645fa7a5b74f67c12916998150/in-good-company-preview/index.html'
          curl --fail --show-error --silent --location --dump-header headers.txt --output preview.html "$URL"
          echo '--- response headers ---'
          cat headers.txt
          echo '--- file size ---'
          wc -c preview.html
          grep -qi 'content-type: text/html' headers.txt
          for required in \
            'In Good Company' \
            'Presence Scan' \
            'Presence Lab' \
            'Senior Presence Advisory' \
            'ERG Portfolio Diagnostic' \
            'ERG Operating Model Build' \
            'Fractional ERG Office'; do
            grep -q "$required" preview.html
          done

      - name: Record successful verification
        shell: bash
        run: |
          {
            echo 'Verified public preview'
            echo 'URL: https://cdn.statically.io/gh/backwardssdrow-source/pac-site@b0dad08524c217645fa7a5b74f67c12916998150/in-good-company-preview/index.html'
            echo "Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            grep -iE '^(HTTP/|content-type:|content-length:)' headers.txt || true
          } > in-good-company-preview/verification.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add in-good-company-preview/verification.txt
          git commit -m 'Verify public In Good Company preview'
          git push
