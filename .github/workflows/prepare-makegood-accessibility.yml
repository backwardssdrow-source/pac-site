name: Prepare MakeGood accessibility refinements
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/prepare-makegood-accessibility.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser checks
        run: |
          python -m pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium webkit
          npm install --no-save axe-core
      - name: Prepare requested changes
        run: |
          python .github/scripts/prepare-makegood-accessibility.py
          python .github/scripts/finalize-makegood-accessibility.py
      - name: Test every page before publication
        env:
          MAKEGOOD_LOCAL: '1'
          MAKEGOOD_WEBKIT: '1'
          MAKEGOOD_REPORT: accessibility-preview
        run: python .github/scripts/verify-makegood-accessibility.py
      - name: Store tested Git tree without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import subprocess,json,os,urllib.request
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          paths=git('diff','--name-only').splitlines()
          allowed={'.github/scripts/verify-makegood.py','.github/scripts/verify-makegood-accessibility.py'}
          assert paths and all(p.startswith('makegood/') or p in allowed for p in paths),paths
          entries=[{'path':p,'mode':'100644','type':'blob','content':Path(p).read_text()} for p in paths]
          payload=json.dumps({'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries}).encode()
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees'
          req=urllib.request.Request(url,data=payload,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urllib.request.urlopen(req) as response:tree=json.load(response)
          report={'tree_sha':tree['sha'],'parent_commit':git('rev-parse','HEAD'),'changed_files':paths,'publication':'Not published; requires an explicit commit and branch update.'}
          Path('accessibility-preview/prepared-tree.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Save preview and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makegood-accessibility-preview
          path: accessibility-preview/
          retention-days: 7
