name: Verify live MakeGood community paths
on:
  push:
    branches: [gh-pages]
    paths: ['makegood/**', '.github/scripts/verify-makegood-community.py', '.github/workflows/verify-makegood-community.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-community:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and accessibility checks
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
          npm install --no-save axe-core
      - name: Check published copy and service paths
        env:
          MAKEGOOD_WEBKIT: '1'
        run: python .github/scripts/verify-makegood-community.py
      - name: Save live screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makegood-community-live
          path: community-verification/
          retention-days: 7
