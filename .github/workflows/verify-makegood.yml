name: Verify MakeGood website and redirect
on:
  push:
    branches: [gh-pages]
    paths: ['makegood/**', 'in-good-company-preview/index.html', '.github/workflows/verify-makegood.yml', '.github/scripts/verify-makegood.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser checks
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify published pages and interactions
        run: python .github/scripts/verify-makegood.py
      - name: Save screenshots and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makegood-site-verification
          path: makegood-verification/
          retention-days: 7
