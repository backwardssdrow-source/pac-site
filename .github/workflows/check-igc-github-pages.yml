name: Check Make Good pricing preview

on:
  push:
    branches: [gh-pages]
    paths:
      - 'in-good-company-preview/**'
      - '.github/workflows/check-igc-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the current service page
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('in-good-company-preview/index.html', 'utf8');
          const required = ['Make Good | Services and Founding Pricing','Coaching &amp; Thought Partnership','$1,250','$2,500','$9,000','$18,000','$7,500','$5,000','$10,000','$2,000','$3,500/month','$22,500 minimum','$6,000 initial total','$10,500 total','Fee confirmed before booking','No positive review is required.'];
          for (const value of required) if (!html.includes(value)) throw new Error('Missing: ' + value);
          for (const value of ['August 2026','Limited August','From $15,000','From $30,000','From $12,000/month','From $9,500','From $20,000','From $4,000/month','6-month minimum','hello@in-good-company.example','site-payload-06.js']) {
            if (html.includes(value)) throw new Error('Obsolete content: ' + value);
          }
          if ((html.match(/data-route="service\//g) || []).length !== 6) throw new Error('Expected six core service routes');
          if (/<(?:del|s|strike)[\s>]/i.test(html)) throw new Error('Unexpected reference-price markup');
          for (const id of ['service-coaching','service-decision-session','service-practice-lab','service-erg-portfolio-diagnostic','service-erg-operating-model-build','service-fractional-erg-office','service-presence-scan','service-presence-lab','service-senior-presence-advisory']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing service anchor: ' + id);
          }
          console.log('Source pricing, scope markers and routes verified.');
          NODE
      - name: Verify the hosted preview has the same content
        shell: bash
        run: |
          set -euo pipefail
          URL='https://backwardssdrow-source.github.io/pac-site/in-good-company-preview/'
          for attempt in $(seq 1 18); do
            STATUS=$(curl --max-time 20 --silent --show-error --location --output /tmp/make-good-live.html --write-out '%{http_code}' "${URL}?revision=${GITHUB_SHA}" || true)
            if [ "$STATUS" = '200' ] && cmp -s in-good-company-preview/index.html /tmp/make-good-live.html; then
              echo "Verified current Make Good page: $URL" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: hosted page not yet identical (HTTP $STATUS)."
            sleep 10
          done
          echo 'Source is updated, but the hosted page could not be verified at the same version.' >&2
          exit 1
