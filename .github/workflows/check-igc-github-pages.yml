name: Check MakeGood content and legacy redirect

on:
  push:
    branches: [gh-pages]
    paths:
      - 'makegood/**'
      - 'in-good-company-preview/index.html'
      - 'in-good-company-preview/sunrise.js'
      - '.github/workflows/check-igc-github-pages.yml'
      - '.github/scripts/verify-makegood-content.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify current pages, service fees, privacy and redirect
        run: python .github/scripts/verify-makegood-content.py
      - name: Verify the hosted MakeGood page
        shell: bash
        run: |
          set -euo pipefail
          URL='https://backwardssdrow-source.github.io/pac-site/makegood/'
          for attempt in $(seq 1 18); do
            STATUS=$(curl --max-time 20 --silent --show-error --location --output /tmp/makegood-live.html --write-out '%{http_code}' "${URL}?revision=${GITHUB_SHA}" || true)
            if [ "$STATUS" = '200' ] && cmp -s makegood/index.html /tmp/makegood-live.html; then
              echo "Verified current MakeGood page: $URL" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: hosted page not yet identical (HTTP $STATUS)."
            sleep 10
          done
          echo 'The hosted page could not be verified at the same version.' >&2
          exit 1

