name: Check In Good Company GitHub Pages preview

on:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/check-igc-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for complete site and validate content
        shell: bash
        run: |
          URL='https://backwardssdrow-source.github.io/pac-site/in-good-company-preview/'
          STATUS='000'
          for attempt in 1 2 3 4 5 6; do
            STATUS=$(curl --silent --show-error --location --output page.html --write-out '%{http_code}' "$URL" || true)
            echo "Attempt $attempt: $STATUS"
            if [ "$STATUS" = '200' ] \
               && grep -q 'Presence Scan' page.html \
               && grep -q 'Presence Lab' page.html \
               && grep -q 'Senior Presence Advisory' page.html \
               && grep -q 'ERG Portfolio Diagnostic' page.html \
               && grep -q 'ERG Operating Model Build' page.html \
               && grep -q 'Fractional ERG Office' page.html; then
              break
            fi
            sleep 10
          done
          CONTENT='FAILED'
          if [ "$STATUS" = '200' ] \
             && grep -q 'Presence Scan' page.html \
             && grep -q 'Presence Lab' page.html \
             && grep -q 'Senior Presence Advisory' page.html \
             && grep -q 'ERG Portfolio Diagnostic' page.html \
             && grep -q 'ERG Operating Model Build' page.html \
             && grep -q 'Fractional ERG Office' page.html; then
            CONTENT='VERIFIED'
          fi
          {
            echo "$CONTENT complete partner-review website"
            echo "HTTP status: $STATUS"
            echo "Checked at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "URL: $URL"
            echo "Downloaded bytes: $(wc -c < page.html 2>/dev/null || echo missing)"
          } > pages-check.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-check.txt
          git commit -m 'Verify complete In Good Company GitHub Pages site'
          git push
