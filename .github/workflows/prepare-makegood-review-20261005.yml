name: Prepare approved MakeGood review
on:
  push:
    branches: [makegood-travis-review-20261005]
    paths: ['.github/workflows/prepare-makegood-review-20261005.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: makegood-travis-review-20261005
      - name: Unpack checksum-verified approved source
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, re
          from pathlib import Path, PurePosixPath
          folder=Path('.github/review-package-20261005')
          encoded=''.join((folder/f'{i:02}.b64').read_text().strip() for i in range(1,7))
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='817e3b558d2a6764709b55be1f58f9b92b46b6b8f76015661dfa8e19b3aaac88','Package checksum mismatch'
          files=json.loads(raw)
          assert len(files)==21,len(files)
          scripts={'.github/scripts/verify-makegood.py','.github/scripts/verify-makegood-readability.py'}
          for relative,content in files.items():
              p=PurePosixPath(relative)
              assert not p.is_absolute() and '..' not in p.parts,relative
              assert relative.startswith('makegood/') or relative in scripts,relative
              assert isinstance(content,str)
              if relative.endswith('.html'):
                  content=content.replace('aria-label="MakeGood Co. home" class="brand"','aria-label="MakeGood Co. People. Culture. Possibilities. Home" class="brand"')
                  content=re.sub(r'aria-label="Explore ([^"]+): service and fees"',r'aria-label="Explore service &amp; fees: \1"',content)
              target=Path(relative);target.parent.mkdir(parents=True,exist_ok=True);target.write_text(content,encoding='utf-8')
          print('Unpacked approved source:',len(files),'files')
          PY
      - name: Install browser and accessibility checks
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          npm install --no-save axe-core
      - name: Verify all fifteen review pages
        env:
          MAKEGOOD_LOCAL: '1'
        run: python .github/scripts/verify-makegood.py
      - name: Save review screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makegood-travis-review-checks
          path: makegood-verification/
          retention-days: 7
      - name: Commit verified pages to staging only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add makegood .github/scripts/verify-makegood.py .github/scripts/verify-makegood-readability.py
          git commit -m 'Build verified approved MakeGood review pages'
          git push origin HEAD:makegood-travis-review-20261005
